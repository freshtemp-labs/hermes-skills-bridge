<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hermes Skills Bridge — Top 100+</title>
  <style>
    :root {
      --bg: #0b0d11;
      --surface: #141820;
      --surface2: #1c2130;
      --border: #2a3040;
      --text: #e2e8f0;
      --text-dim: #8899b0;
      --accent: #6c8cff;
      --accent2: #5eead4;
      --red: #f87171;
      --green: #4ade80;
      --orange: #fb923c;
      --tag-colors: {
        Framework: #6c8cff;
        Tool: #5eead4;
        Platform: #f59e0b;
        Utility: #a78bfa;
        Agent: #f472b6;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .header {
      max-width: 1200px;
      margin: 0 auto;
      padding: 48px 24px 32px;
    }

    .header h1 {
      font-size: 32px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header p {
      color: var(--text-dim);
      margin-top: 8px;
      font-size: 15px;
    }

    .stats-bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .stat-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      color: var(--text-dim);
    }

    .stat-chip strong { color: var(--text); }

    .controls {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px 16px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-box {
      flex: 1;
      min-width: 200px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box:focus { border-color: var(--accent); }
    .search-box::placeholder { color: var(--text-dim); }

    .filter-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }

    .filter-btn:hover { border-color: var(--accent); color: var(--text); }
    .filter-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .divider { color: var(--border); font-size: 14px; padding: 0 4px; }

    .grid {
      max-width: 1200px;
      margin: 0 auto;
      padding: 8px 24px 48px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 12px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 18px;
      transition: all 0.15s;
      cursor: default;
    }

    .card:hover {
      border-color: #3a4560;
      background: var(--surface2);
      transform: translateY(-1px);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .card-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace;
      word-break: break-all;
    }

    .card-pop {
      font-size: 11px;
      color: var(--text-dim);
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .pop-bar {
      width: 60px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .pop-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 2px;
      transition: width 0.3s;
    }

    .card-category {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 6px;
    }

    .card-desc {
      font-size: 13px;
      color: var(--text-dim);
      margin-top: 8px;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-tags {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .tag {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 500;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .tag-Framework { background: #6c8cff22; color: #6c8cff; border: 1px solid #6c8cff33; }
    .tag-Tool { background: #5eead422; color: #5eead4; border: 1px solid #5eead433; }
    .tag-Platform { background: #f59e0b22; color: #f59e0b; border: 1px solid #f59e0b33; }
    .tag-Utility { background: #a78bfa22; color: #a78bfa; border: 1px solid #a78bfa33; }
    .tag-Agent { background: #f472b622; color: #f472b6; border: 1px solid #f472b633; }

    .card-repo {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .card-repo a {
      color: var(--accent);
      text-decoration: none;
    }

    .card-repo a:hover { text-decoration: underline; }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 48px;
      color: var(--text-dim);
    }

    .empty-state strong { color: var(--text); }

    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; }
      .header { padding: 24px 16px; }
      .controls { padding: 0 16px; }
      .grid { padding: 8px 16px 32px; }
    }
  </style>
</head>
<body>

<div class="header">
  <h1>✦ Hermes Skills Bridge</h1>
  <p>106 verified skills for Hermes Agent — import any skill with one command</p>
  <div class="stats-bar">
    <span class="stat-chip">📦 <strong id="totalSkills">106</strong> skills</span>
    <span class="stat-chip">🏷️ <strong id="tagCount">5</strong> categories</span>
    <span class="stat-chip">📋 <strong id="sourceCount">18</strong> repos</span>
    <span class="stat-chip" id="activeFilter">🔍 All</span>
  </div>
</div>

<div class="controls">
  <input class="search-box" id="searchBox" type="text" placeholder="Search skills by name or description..." autofocus>

  <div class="filter-group" id="tagFilters">
    <button class="filter-btn active" data-tag="all">All</button>
  </div>

  <span class="divider">|</span>

  <div class="filter-group" id="categoryFilters">
    <button class="filter-btn active" data-cat="all">All</button>
  </div>
</div>

<div class="grid" id="skillGrid"></div>

<script>
const SKILLS_URL = '/top100.json';

let allSkills = [];
let activeTag = 'all';
let activeCategory = 'all';

function getTagColor(name) {
  const colors = {
    Framework: '#6c8cff', Tool: '#5eead4',
    Platform: '#f59e0b', Utility: '#a78bfa', Agent: '#f472b6'
  };
  return colors[name] || '#8899b0';
}

function render() {
  const q = document.getElementById('searchBox').value.toLowerCase().trim();

  let filtered = allSkills.filter(s => {
    // Search
    if (q) {
      const inName = s.name.toLowerCase().includes(q);
      const inDesc = (s.description || '').toLowerCase().includes(q);
      const inReason = (s.reason || '').toLowerCase().includes(q);
      if (!inName && !inDesc && !inReason) return false;
    }
    // Tag filter
    if (activeTag !== 'all' && !(s.tags || []).includes(activeTag)) return false;
    // Category filter
    if (activeCategory !== 'all' && s.category !== activeCategory) return false;
    return true;
  });

  // Update stats
  document.getElementById('activeFilter').textContent = `🔍 ${filtered.length} / ${allSkills.length}`;

  const grid = document.getElementById('skillGrid');
  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-state">No skills match <strong>"${q || activeTag !== 'all' ? activeTag : activeCategory !== 'all' ? activeCategory : ''}"</strong></div>`;
    return;
  }

  grid.innerHTML = filtered.map(s => {
    const tags = s.tags || [];
    const tagHtml = tags.map(t => `<span class="tag tag-${t}">${t}</span>`).join('');
    const pop = s.popularity_score || 0.5;
    const repoUrl = s.repo ? `https://github.com/${s.repo}` : '#';
    return `
      <div class="card">
        <div class="card-header">
          <div class="card-name">${s.name}</div>
          <div class="card-pop">
            ${(pop * 100).toFixed(0)}
            <div class="pop-bar"><div class="pop-fill" style="width:${pop * 100}%"></div></div>
          </div>
        </div>
        <div class="card-category">${s.category}</div>
        <div class="card-desc">${s.description || s.reason || ''}</div>
        <div class="card-tags">${tagHtml}</div>
        <div class="card-repo">
          <span>📦</span>
          <a href="${repoUrl}" target="_blank" rel="noopener">${s.repo || ''}</a>
          <span style="color:var(--text-dim)">·</span>
          <span style="color:var(--text-dim)">${s.path || ''}</span>
        </div>
      </div>
    `;
  }).join('');
}

// ─── Load data ────────────────────────────────────────────────

fetch('/top100.json')
  .then(r => r.json())
  .then(data => {
    allSkills = data.skills || [];

    document.getElementById('totalSkills').textContent = allSkills.length;

    // Collect unique tags & categories
    const tags = new Set();
    const cats = new Set();
    const repos = new Set();
    allSkills.forEach(s => {
      (s.tags || []).forEach(t => tags.add(t));
      cats.add(s.category);
      if (s.repo) repos.add(s.repo);
    });
    document.getElementById('tagCount').textContent = tags.size;
    document.getElementById('sourceCount').textContent = repos.size;

    // Tag filter buttons
    const tagContainer = document.getElementById('tagFilters');
    const tagOrder = ['Framework', 'Tool', 'Platform', 'Utility', 'Agent'];
    tagOrder.forEach(t => {
      if (tags.has(t)) {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.dataset.tag = t;
        btn.textContent = t;
        btn.addEventListener('click', () => {
          document.querySelectorAll('#tagFilters .filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeTag = btn.dataset.tag;
          render();
        });
        tagContainer.appendChild(btn);
      }
    });

    // Category filter buttons
    const catContainer = document.getElementById('categoryFilters');
    const catOrder = ['software-development', 'creative', 'research', 'productivity', 'devops', 'red-teaming', 'data-science', 'mlops', 'social-media'];
    catOrder.forEach(c => {
      if (cats.has(c)) {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.dataset.cat = c;
        btn.textContent = c.replace(/-/g, ' ');
        btn.addEventListener('click', () => {
          document.querySelectorAll('#categoryFilters .filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeCategory = btn.dataset.cat;
          render();
        });
        catContainer.appendChild(btn);
      }
    });

    render();
  })
  .catch(err => {
    document.getElementById('skillGrid').innerHTML =
      `<div class="empty-state">⚠️ Failed to load skills: ${err.message}</div>`;
  });

// Search on input
document.getElementById('searchBox').addEventListener('input', render);
</script>

</body>
</html>
